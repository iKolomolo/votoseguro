# Blueprint de Render: backend (Docker, con Tesseract y tareas automáticas) en plan gratuito. La base de datos
# PostgreSQL está en Neon (la gratuita de Render se borra a los 30 días).
# El frontend se publica aparte en Vercel (frontend/vercel.json) y llama a este backend.
services:
  - type: web
    name: votoseguro-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      # Base PostgreSQL en Neon (plan gratuito, no expira). Cadena de conexión DIRECTA (sin "-pooler"), región en
      # Estados Unidos; se pega en el panel de Render.
      - key: VOTOSEGURO_DATABASE_URL
        sync: false
      # Se piden al crear el servicio. La clave maestra debe guardarse aparte: sin ella los datos no se recuperan.
      - key: VOTOSEGURO_MASTER_KEY
        sync: false
      - key: VOTOSEGURO_ADMIN_PASSWORD
        sync: false
      # Dominios del proyecto "votoseguro" en Vercel, incluidas sus vistas previas (votoseguro-xxxx.vercel.app).
      - key: VOTOSEGURO_CORS_ORIGEN_REGEX
        value: https://votoseguro(-[a-z0-9-]+)?\.vercel\.app
      # Render pasa la IP real del ciudadano en X-Forwarded-For (límites de intentos y bitácora).
      - key: VOTOSEGURO_CONFIAR_X_FORWARDED_FOR
        value: "true"
      # Producción sin datos de ejemplo: solo personas reales que se inscriban voluntariamente.
      - key: VOTOSEGURO_SEMBRAR_DATOS_DEMO
        value: "false"
